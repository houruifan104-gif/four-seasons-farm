<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职业卡样例 · 伐木工与季节工</title><link rel="stylesheet" href="../../style.css"><style>
body{margin:0;background:#eee7d8;color:#493f30;min-height:100dvh}
.sample-page{width:min(980px,100%);margin:auto;padding:32px 24px}
.sample-heading{margin:0 0 22px;font:600 23px/1.4 'Songti SC',serif;color:#756241}
.sample-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;align-items:stretch}
.sample-grid .farm-card{padding:20px;min-width:0;border-radius:12px}
.sample-grid .farm-card .fc-title{margin:0;font-size:30px;padding:12px 0}
.sample-grid .farm-card .fc-art{height:auto;aspect-ratio:3/2;border-radius:5px;overflow:hidden}
.sample-grid .fc-art img{display:block;width:100%;height:100%;object-fit:cover}
.sample-grid .farm-card .fc-rules{padding:14px 0 12px;min-height:114px}
.sample-grid .farm-card .fc-effect{font-size:17px;line-height:1.85;margin:0}
@media(max-width:650px){.sample-page{padding:20px 14px}.sample-grid{grid-template-columns:1fr;gap:22px}.sample-grid .farm-card{padding:16px}.sample-grid .farm-card .fc-rules{min-height:0}}
</style></head><body><main class="sample-page"><h1 class="sample-heading">职业卡样例</h1><div class="sample-grid"><article class="detail-face farm-card fc-occupation" aria-label="伐木工">
      <div class="fc-top"><span class="fc-type">职业<span class="fc-players">1+ 人</span></span><span class="fc-id">A116</span></div>
      <h2 class="fc-title">伐木工</h2>
      <div class="fc-art"><img src="./A116.jpg" width="1536" height="1024" alt="伐木工的田园手绘插画"></div>
      <div class="fc-rules"><p class="fc-effect">每次使用木材累积格，额外得一木。</p></div>
    </article><article class="detail-face farm-card fc-occupation" aria-label="季节工">
      <div class="fc-top"><span class="fc-type">职业<span class="fc-players">1+ 人</span></span><span class="fc-id">A114</span></div>
      <h2 class="fc-title">季节工</h2>
      <div class="fc-art"><img src="./A114.jpg" width="1536" height="1024" alt="季节工的田园手绘插画"></div>
      <div class="fc-rules"><p class="fc-effect">使用临时劳作格额外得一谷物；从第六轮起可改选一蔬菜。</p></div>
    </article></div></main></body></html>
